
name: Tests (Unit + Integration)

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ main, lab6 ]

jobs:
  codestyle:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CodeStyle checks
        id: check
        run: |
          cd PPO_f
          chmod +x gradlew
          mkdir -p build/codestyle-results
          touch build/codestyle-results/output.log
      
          ./gradlew checkstyleAll >> build/codestyle-results/output.log 2>&1 || {
            echo "Code style checks failed" >> build/codestyle-results/output.log
            exit 1
          }

      - name: Upload CodeStyle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codestyle-logs
          path: PPO_f/build/codestyle-results/output.log


  cc-check:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CodeStyle checks
        id: check
        run: |
          cd PPO_f
          chmod +x gradlew
          mkdir -p build/cccheck-results
          touch build/cccheck-results/output.log
      
          ./gradlew :metrics-analyzer:run >> build/cccheck-results/output.log 2>&1 || {
            echo "Code style checks failed" >> build/cccheck-results/output.log
            exit 1
          }

      - name: Upload CodeStyle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cccheck-logs
          path: PPO_f/build/cccheck-results/output.log

          
  unit-tests:
    runs-on: ubuntu-latest
    needs: [cc-check, codestyle]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for unit tests
        run: docker build -t unit-tests-image -f ./Dockerfile.unit .

      - name: Run unit tests
        run: |
          set -e
          mkdir -p build/allure-results
          docker run --rm \
            -v ${{ github.workspace }}/build/allure-results:/app/PPO_f/build/allure-results \
            unit-tests-image || {
              echo "Unit tests failed"
              exit 1
            }
      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: build/allure-results

  integration-tests:
    runs-on: ubuntu-latest
    needs: [cc-check, codestyle, unit-tests]
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Run integration tests
        run: |
          set -e
          mkdir -p build/allure-results
          docker compose -f docker-compose.integration.yml down -v || true
          docker compose -f docker-compose.integration.yml up --build --abort-on-container-exit || {
            echo "Integration tests failed"
            docker compose -f docker-compose.integration.yml logs
            docker compose -f docker-compose.integration.yml down -v || true
            exit 1
          }
          docker compose -f docker-compose.integration.yml down -v
      - name: Upload integration test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: PPO_f/app_cli/build/allure-results

      - name: Rollback DB if integration failed
        if: ${{ failure() }}
        run: |
          echo "Integration тесты упали — откатываем базу данных..."
          docker compose -f docker-compose.integration.yml down -v || true
          docker volume prune -f || true
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [cc-check, codestyle, unit-tests, integration-tests]
    if: ${{ success() }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR for E2E
        run: |
          set -e
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli_server:build -x test
      - name: Copy JAR for Docker build
        run: |
          mkdir -p build/libs
          cp PPO_f/app_cli_server/build/libs/app_cli_server-1.0-SNAPSHOT.jar build/libs/
      - name: Build Docker image for E2E tests
        run: docker build -t e2e-test-image -f Dockerfile.e2e .

      - name: Run E2E tests inside Docker
        run: |
          set -e
          mkdir -p build/allure-results
          docker run --rm \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            -v ${{ github.workspace }}/build/allure-results:/app/PPO_f/build/allure-results \
            e2e-test-image || {
              echo "E2E tests failed"
              exit 1
            }
      - name: Upload E2E test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: build/allure-results

      - name: Rollback DB if e2e failed
        if: ${{ failure() }}
        run: |
          echo "E2E тесты упали — откатываем базу данных..."
          docker stop $(docker ps -q --filter "ancestor=postgres:15") || true
          docker rm $(docker ps -aq --filter "ancestor=postgres:15") || true
          docker volume prune -f || true
 
