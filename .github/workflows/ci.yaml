name: Unit Tests DB & BL in Docker

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: |
        docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run unit tests in Docker
      run: |
        mkdir -p test-results
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/test-results:/app/PPO_f/test-results \
          unit-tests-image

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: PPO_f/test-results
