name: Tests (Unit + Integration + E2E)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  # ---------- 3. E2E tests ----------
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Build JAR for E2E
        run: |
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli:build
          ls -l app_cli/build/libs

      - name: Build Docker image for E2E test
        run: |
          docker build -t e2e-test-image -f ./Dockerfile.e2e .

      - name: Run E2E tests inside Docker
        run: |
          docker run --rm \
            -e POSTGRES_HOST=host.docker.internal \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            -v ${{ github.workspace }}/PPO_f:/app/PPO_f \
            e2e-test-image

