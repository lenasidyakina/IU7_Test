name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
    # ---------- 3. E2E tests ----------
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR for e2e test
        run: |
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli:build
          ls -l app_cli/build/libs  # покажем, что jar реально создан

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install psycopg2-binary testcontainers

      - name: Run E2E tests
        run: |
          cd PPO_f
          python3 main.py


      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install testcontainers psycopg2-binary

      - name: Run E2E tests
        working-directory: PPO_f
        run: python main.py
