name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v2

      - name: Run integration tests via Docker Compose
        run: |
          mkdir -p ${{ github.workspace }}/PPO_f/test-results/integration
          # Поднимаем контейнеры и выполняем тесты
          docker compose -f docker-compose.integration.yml up --build --abort-on-container-exit
          # Копируем результаты тестов из контейнера app
          docker cp $(docker compose -f docker-compose.integration.yml ps -q app):/app/PPO_f/app_cli/build/test-results/test ./PPO_f/test-results/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: PPO_f/test-results/integration



