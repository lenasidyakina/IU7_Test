name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run unit tests in Docker (JUnit + Allure)
      run: |
        mkdir -p ${{ github.workspace }}/PPO_f/test-results/unit
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/test-results/unit:/app/PPO_f/build/reports/allure-report \
          unit-tests-image

    # 📦 Загружаем HTML отчёт
    - name: Upload Allure HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: PPO_f/test-results/unit
