name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  # ---------- 1. Unit tests ----------
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run unit tests in Docker
      run: |
        mkdir -p ${{ github.workspace }}/PPO_f/test-results/unit
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/test-results/unit:/app/PPO_f/test-results \
          unit-tests-image

    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: PPO_f/test-results/unit

  # ---------- 2. Integration tests ----------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests  # Запускается только если unit-тесты прошли успешно

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for integration tests
      run: docker build -t integration-tests-image -f ./Dockerfile.integration .

    - name: Run integration tests in Docker
      run: |
        mkdir -p ${{ github.workspace }}/PPO_f/test-results/integration
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/test-results/integration:/app/PPO_f/test-results \
          integration-tests-image

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-reports
        path: PPO_f/test-results/integration
