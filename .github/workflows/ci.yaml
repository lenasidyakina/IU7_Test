name: Integration Tests

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run integration tests
        run: |
          # Создаём директорию для результатов
          mkdir -p PPO_f/test-results/integration

          # Поднимаем контейнеры и запускаем тесты
          docker compose -f docker-compose.integration.yml up --build --abort-on-container-exit

          # Копируем результаты тестов из контейнера app
          APP_CONTAINER=$(docker compose -f docker-compose.integration.yml ps -q app)
          docker cp $APP_CONTAINER:/app/PPO_f/app_cli/build/test-results/test PPO_f/test-results/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: PPO_f/test-results/integration
