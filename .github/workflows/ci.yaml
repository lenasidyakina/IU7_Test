  check-quality-gate:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:9.9-community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="exit 0"  # отключаем дефолтный healthcheck
    steps:
      - uses: actions/checkout@v4

      # Ждем, пока SonarQube станет доступен
      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube to be ready..."
          for i in {1..60}; do
            status=$(curl -sSf http://localhost:9000/api/system/health || echo "")
            if [[ "$status" == *"UP"* ]]; then
              echo "SonarQube is UP"
              break
            fi
            echo "Not ready yet... waiting 5s"
            sleep 5
          done

      # Импортируем профиль качества
      - name: Import SonarQube Quality Profile
        run: |
          for i in {1..5}; do
            curl -sSf -u "sqp_79c9690919aba5e92b23e8d080287d2e3ae8f7f0:" \
                 -X POST \
                 -F "file=@ci/sonarqube-config/AllRulesDisabled.zip" \
                 http://localhost:9000/api/qualityprofiles/restore && break || echo "Retrying..."
            sleep 5
          done

      # Импортируем Quality Gate
      - name: Import SonarQube Quality Gate
        run: |
          for i in {1..5}; do
            curl -sSf -u "sqp_79c9690919aba5e92b23e8d080287d2e3ae8f7f0:" \
                 -X POST \
                 -H "Content-Type: application/json" \
                 -d @ci/sonarqube-config/S1541_Only_gate.json \
                 http://localhost:9000/api/qualitygates/create && break || echo "Gate may already exist, retrying..."
            sleep 5
          done

      # Запускаем Gradle анализ и проверку Quality Gate
      - name: Run Gradle SonarQube analysis
        run: |
          cd PPO_f
          chmod +x gradlew
          mkdir -p build/checkQualityGate-results
          touch build/checkQualityGate-results/output.log
          
          ./gradlew clean sonarqube >> build/checkQualityGate-results/output.log 2>&1 || true
          ./gradlew checkQualityGate >> build/checkQualityGate-results/output.log 2>&1 || exit 1

      # Загружаем лог
      - name: Upload Quality Gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkQualityGate-logs
          path: PPO_f/build/checkQualityGate-results/output.log


