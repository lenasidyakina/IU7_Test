
name: Tests (Unit + Integration)

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ main, lab6 ]

jobs:
  codestyle:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CodeStyle checks
        id: check
        run: |
          cd PPO_f
          chmod +x gradlew
          mkdir -p build/codestyle-results
          touch build/codestyle-results/output.log
      
          ./gradlew checkstyleAll >> build/codestyle-results/output.log 2>&1 || {
            echo "Code style checks failed" >> build/codestyle-results/output.log
            exit 1
          }

      - name: Upload CodeStyle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codestyle-logs
          path: PPO_f/build/codestyle-results/output.log


  cc-check:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CodeStyle checks
        id: check
        run: |
          cd PPO_f
          chmod +x gradlew
          mkdir -p build/cccheck-results
          touch build/cccheck-results/output.log
      
          ./gradlew :metrics-analyzer:run >> build/cccheck-results/output.log 2>&1 || {
            echo "Code style checks failed" >> build/cccheck-results/output.log
            exit 1
          }

      - name: Upload CodeStyle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cccheck-logs
          path: PPO_f/build/cccheck-results/output.log
