name: Unit Tests

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x ./PPO_f/gradlew

    - name: Run unit tests for DB and BL modules
      working-directory: ./PPO_f
      run: ./gradlew :DB:test :BL:test
