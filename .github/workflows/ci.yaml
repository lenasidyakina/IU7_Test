name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run tests and generate Allure report
      run: |
        mkdir -p ${{ github.workspace }}/PPO_f/build/allure-results
        mkdir -p ${{ github.workspace }}/PPO_f/build/reports/allure-report
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/build/allure-results:/app/PPO_f/build/allure-results \
          -v ${{ github.workspace }}/PPO_f/build/reports/allure-report:/app/PPO_f/build/reports/allure-report \
          unit-tests-image
    - name: Upload Allure HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: PPO_f/build/reports/allure-report
        
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and run integration tests via Docker Compose
        run: |
          mkdir -p PPO_f/app_cli/build/allure-results
          mkdir -p PPO_f/app_cli/build/reports/allure-report
          
          # Сброс предыдущих контейнеров
          docker compose -f docker-compose.integration.yml down -v
          
          # Запуск контейнеров (Postgres + тесты)
          docker compose -f docker-compose.integration.yml up --build --abort-on-container-exit

          # Остановить контейнеры
          docker compose -f docker-compose.integration.yml down -v

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-integration
          path: PPO_f/app_cli/build/reports/allure-report
