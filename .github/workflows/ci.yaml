name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
    # ---------- 3. E2E tests ----------
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR for E2E
        run: |
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli:build
          ls -l app_cli/build/libs

      - name: Build Docker image for E2E test
        run: |
          docker build -t e2e-test-image -f ./PPO_f/Dockerfile.e2e ./PPO_f

      - name: Run E2E tests inside Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/PPO_f/app_cli/build/libs:/app_cli/build/libs \
            e2e-test-image


      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install testcontainers psycopg2-binary

      - name: Run E2E tests
        working-directory: PPO_f
        run: python main.py
