name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run tests and generate Allure report
      run: |
        # Создаём папки для монтирования JSON и HTML отчёта
        mkdir -p ${{ github.workspace }}/PPO_f/build/allure-results
        mkdir -p ${{ github.workspace }}/PPO_f/build/reports/allure-report
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/build/allure-results:/app/PPO_f/build/allure-results \
          -v ${{ github.workspace }}/PPO_f/build/reports/allure-report:/app/PPO_f/build/reports/allure-report \
          unit-tests-image

    - name: Upload Allure HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: PPO_f/build/reports/allure-report/allureReport/index.html
