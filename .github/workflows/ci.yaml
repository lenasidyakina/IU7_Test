name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  # ---------- 1. Unit tests ----------
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image for unit tests
      run: docker build -t unit-tests-image -f ./Dockerfile.unit .

    - name: Run unit tests in Docker
      run: |
        mkdir -p ${{ github.workspace }}/PPO_f/test-results/unit
        docker run --rm \
          -v ${{ github.workspace }}/PPO_f/test-results/unit:/app/PPO_f/test-results \
          unit-tests-image

    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: PPO_f/test-results/unit

  # ---------- 2. Integration tests ----------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build integration test image
        run: docker build -t bd-integration-tests -f ./Dockerfile.integration .

      - name: Run integration tests (Testcontainers)
        run: |
          mkdir -p test-results
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/test-results:/app/PPO_f/build/reports/tests/test \
            bd-integration-tests

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-results


