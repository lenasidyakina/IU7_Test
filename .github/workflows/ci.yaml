name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for integration tests
        run: docker build -t bd-integration-tests -f ./Dockerfile.integration .

      - name: Run integration tests in Docker
        run: |
          mkdir -p ${{ github.workspace }}/PPO_f/test-results/integration
          docker run --rm \
            -v ${{ github.workspace }}/PPO_f/test-results/integration:/app/test-results \
            -e SPRING_PROFILES_ACTIVE=test \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/testdb \
            -e SPRING_DATASOURCE_USERNAME=testuser \
            -e SPRING_DATASOURCE_PASSWORD=testpassword \
            bd-integration-tests \
            bash -c "mkdir -p /app/test-results && ./gradlew :app_cli:test --stacktrace --info -Dorg.gradle.report.outputDir=/app/test-results"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: PPO_f/test-results/integration
