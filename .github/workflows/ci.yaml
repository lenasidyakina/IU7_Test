name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

    container:
      image: python:3.11-slim
      env:
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpassword
        POSTGRES_DB: testdb
      options: >-
        --health-cmd="pg_isready -U testuser -h postgres -d testdb"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y openjdk-17-jdk curl
          pip install psycopg2 requests pytest

      - name: Run E2E tests
        run: |
          echo "⏳ Ждём, пока PostgreSQL станет доступен..."
          for i in {1..20}; do
            if pg_isready -h postgres -U testuser -d testdb > /dev/null; then
              echo "✅ PostgreSQL доступен!"
              break
            fi
            sleep 3
          done
          pytest -v PPO_f/main.py
