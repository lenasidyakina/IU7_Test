name: Tests (Unit + Integration + E2E)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for unit tests
        run: docker build -t unit-tests-image -f ./Dockerfile.unit .

      - name: Run unit tests in Docker
        run: |
          mkdir -p PPO_f/test-results/unit
          docker run --rm \
            -v ${{ github.workspace }}/PPO_f/test-results/unit:/app/PPO_f/test-results \
            unit-tests-image \
            pytest --junitxml=/app/PPO_f/test-results/unit/results.xml \
                   --html=/app/PPO_f/test-results/unit/report.html \
                   --self-contained-html || true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: PPO_f/test-results/unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success()   # не запускаем, если unit упал
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant Gradle execution permission
        run: chmod +x PPO_f/gradlew

      - name: Run integration tests
        run: |
          cd PPO_f
          mkdir -p test-results/integration
          ./gradlew :app_cli:test \
            --stacktrace --info \
            -Dorg.gradle.report.outputDir=./test-results/integration \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:postgresql://postgres:5432/testdb \
            -Dspring.datasource.username=testuser \
            -Dspring.datasource.password=testpassword || exit 1

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: PPO_f/test-results/integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: success()   # не запускаем, если integration упал
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JAR for E2E
        run: |
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli:build -x test

      - name: Copy JAR for Docker
        run: mkdir -p build/libs && cp PPO_f/app_cli/build/libs/app_cli-1.0-SNAPSHOT.jar build/libs/

      - name: Build Docker image for E2E
        run: docker build -t e2e-test-image -f Dockerfile.e2e .

      - name: Run E2E tests in Docker
        run: |
          mkdir -p PPO_f/test-results/e2e
          docker run --rm \
            -v ${{ github.workspace }}/PPO_f/test-results/e2e:/app/PPO_f/test-results \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            e2e-test-image \
            pytest PPO_f --junitxml=/app/PPO_f/test-results/e2e/results.xml \
                         --html=/app/PPO_f/test-results/e2e/report.html \
                         --self-contained-html || true

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: PPO_f/test-results/e2e

  mark-skipped:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Create skipped reports for non-run stages
        run: |
          echo "Creating skipped markers for stages that were not executed..."
          # Можно генерировать пустые JUnit XML с skipped тестами для integration/e2e, если они не выполнялись
