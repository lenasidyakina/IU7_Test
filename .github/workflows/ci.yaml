
name: Tests (Unit + Integration)

on:
  pull_request:
    branches: [ main, lab2 ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permissions for Gradle
        run: chmod +x PPO_f/gradlew

      - name: Run Gradle integration tests
        working-directory: PPO_f
        run: |
          mkdir -p app_cli/build/allure-results
          mkdir -p app_cli/build/reports/allure-report
          ./gradlew :app_cli:test --stacktrace --info
          # Используем путь к результатам
          ./gradlew :app_cli:allureReport -Pallure.resultsDir=app_cli/build/allure-results \
            -Pallure.reportDir=app_cli/build/reports/allure-report


      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-integration
          path: PPO_f/app_cli/build/reports/allure-report
