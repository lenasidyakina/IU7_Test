name: Tests (Unit + Integration)

on:
  push:
    branches: [ new-branch ]
  pull_request:
    branches: [ main, new-branch ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      ml:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd="curl -s http://localhost:11434/api/version || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20


    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR for E2E
        run: |
          set -e
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli_server:build -x test

      - name: Copy JAR for Docker build
        run: |
          mkdir -p build/libs
          cp PPO_f/app_cli_server/build/libs/app_cli_server-1.0-SNAPSHOT.jar build/libs/

      - name: Build Docker image for E2E tests
        run: docker build -t e2e-test-image -f Dockerfile.e2e .

      - name: Run E2E tests inside Docker
        run: |
          set -e
          mkdir -p build/allure-results
          docker run --rm \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            -v ${{ github.workspace }}/build/allure-results:/app/PPO_f/build/allure-results \
            e2e-test-image || {
              echo "E2E tests failed"
              exit 1
            }

      - name: Rollback DB if e2e failed
        if: ${{ failure() }}
        run: |
          echo "E2E тесты упали — откатываем базу данных..."
          docker stop $(docker ps -q --filter "ancestor=postgres:15") || true
          docker rm $(docker ps -aq --filter "ancestor=postgres:15") || true
          docker volume prune -f || true

