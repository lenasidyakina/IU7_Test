  e2e-tests-mock:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR for E2E
        run: |
          set -e
          cd PPO_f
          chmod +x gradlew
          ./gradlew :app_cli_server:build -x test

      - name: Copy JAR for Docker build
        run: |
          mkdir -p build/libs
          cp PPO_f/app_cli_server/build/libs/app_cli_server-1.0-SNAPSHOT.jar build/libs/

      - name: Start Mock Ollama ML service
        run: |
          docker build -t mock-ollama -f Dockerfile.mock .
          docker run -d -p 5000:5000 --name mock-ollama mock-ollama
  
          # Ждём, пока сервис будет доступен
          for i in {1..30}; do
            curl -s http://localhost:5000/api/generate && echo "Mock Ollama доступна" && break
            echo "Ждём Mock Ollama..."
            sleep 3
          done

      - name: Build Docker image for E2E tests
        run: docker build -t e2e-test-image -f Dockerfile.e2e-mock .

      - name: Run E2E tests inside Docker
        run: |
          set -e
          mkdir -p build/allure-results
          docker run --rm \
            --network host \
            -e SPRING_PROFILES_ACTIVE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            -v ${{ github.workspace }}/build/allure-results:/app/PPO_f/build/allure-results \
            e2e-test-image || {
              echo "E2E tests failed"
              exit 1
            }

      - name: Stop Mock Ollama ML service
        if: always()
        run: |
          docker stop mock-ollama || true
          docker rm mock-ollama || true

      - name: Rollback DB if e2e failed
        if: ${{ failure() }}
        run: |
          echo "E2E тесты упали — откатываем базу данных..."
          docker stop $(docker ps -q --filter "ancestor=postgres:15") || true
          docker rm $(docker ps -aq --filter "ancestor=postgres:15") || true
          docker volume prune -f || true
  
