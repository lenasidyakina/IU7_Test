name: Tests (Unit + Integration)

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ main, lab6 ]

jobs:

  build-and-analyze:
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Wait for SonarQube
      run: |
        echo "Waiting for SonarQube to be ready..."
        for i in {1..20}; do
          if curl -s http://localhost:9000/api/system/status | grep -q "UP"; then
            echo "SonarQube is up!"
            break
          fi
          echo "Waiting 5s..."
          sleep 5
        done

    - name: Import SonarQube Quality Profile
      run: |
        for i in {1..5}; do
          curl -sSf -u "sqp_79c9690919aba5e92b23e8d080287d2e3ae8f7f0:" \
               -X POST \
               -F "file=@ci/sonarqube-config/AllRulesDisabled.zip" \
               http://localhost:9000/api/qualityprofiles/restore && break || echo "Retrying..."
          sleep 5
        done

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'

    - name: Build project
      run: ./gradlew build

    - name: SonarQube Analysis
      run: |
        ./gradlew sonarqube \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=admin

    - name: Run tests
      run: ./gradlew test

