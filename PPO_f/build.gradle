plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
    id "org.sonarqube" version "4.3.0.3225" // SonarQube
    id 'checkstyle'
}


checkstyle {
    toolVersion = '10.10.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}


repositories {
    mavenCentral()
}

tasks.withType(Checkstyle) {
    ignoreFailures = false // чтобы билд падал при ошибках
}

group = 'ru.bmstu.iu7'
version = '1.0-SNAPSHOT'


dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'

    testImplementation project(':DB')
}

test {
    useJUnitPlatform()

    // все результаты тестов из BL будут складываться в build/allure-results корня
    systemProperty "allure.results.directory", "$rootProject.buildDir/allure-results"

    // случайный порядок тестов
    systemProperty "junit.jupiter.testmethod.order.default", "random"
}

task allTests(type: Test) {
    group = "verification"
    description = "Runs all tests from BL and DB modules in parallel with Allure reporting"

    dependsOn ":BL:testClasses", ":DB:testClasses" // чтобы классы точно были готовы

    testClassesDirs = files(
            project(':BL').sourceSets.test.output.classesDirs,
            project(':DB').sourceSets.test.output.classesDirs
    )

    classpath = files(
            project(':BL').sourceSets.test.runtimeClasspath,
            project(':DB').sourceSets.test.runtimeClasspath
    )

    systemProperty "junit.jupiter.execution.parallel.enabled", "true"
    systemProperty "junit.jupiter.execution.parallel.mode.default", "concurrent"
    systemProperty "junit.jupiter.execution.parallel.mode.classes.default", "concurrent"

    systemProperty "junit.jupiter.testclass.order.default", "random"
    systemProperty "junit.jupiter.testmethod.order.default", "random"

    systemProperty "allure.results.directory", "$rootProject.buildDir/allure-results"

    maxParallelForks = 1

    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        showStandardStreams = true
        exceptionFormat "short"
    }
}


allure {
    autoconfigure = true
    version = '2.27.0'
}

